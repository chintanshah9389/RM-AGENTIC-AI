services:
  db:
    image: postgres:16-alpine
    container_name: agentic-crm-postgres
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: agentic_banking_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d agentic_banking_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://crm:crm@db:5432/agentic_banking_crm
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3.5-bolt-e4b}
      ORCHESTRATOR_ENGINE: langgraph
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      JWT_SECRET: demo-jwt-secret-change-me
      DATA_SEED: 42
    volumes:
      - ../apps/api:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python scripts/seed_database.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ../apps/web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  pgdata:
